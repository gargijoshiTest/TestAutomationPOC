<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Color Palette Explorer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Color Palette Explorer</h1>

    <div class="controls">
      <label for="search" class="visually-hidden">Search colors</label>
      <input id="search" type="search" placeholder="Search colors or hex (e.g. red, #ff0000)" aria-label="Search colors" />
      <select id="family" aria-label="Filter by family">
        <option value="">All families</option>
        <option value="Red">Red</option>
        <option value="Orange">Orange</option>
        <option value="Yellow">Yellow</option>
        <option value="Green">Green</option>
        <option value="Blue">Blue</option>
        <option value="Purple">Purple</option>
        <option value="Brown">Brown</option>
        <option value="Gray">Gray</option>
      </select>
    </div>

    <div id="list" class="grid horizontal" role="listbox" aria-label="Color list"></div>

    <div id="empty" class="empty" hidden>No colors found</div>
  </main>

  <div id="fallbackBanner" class="empty" hidden>Using fallback dataset (offline mode)</div>
  <div id="announce" role="status" aria-live="polite" class="visually-hidden"></div>

  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-content" role="document">
      <button id="closeModal" class="close" aria-label="Close details">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="lib/filter.js"></script>
  <script src="app.js"></script>
</body>
</html>
